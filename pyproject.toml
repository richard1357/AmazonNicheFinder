[project]
name = "kindle-trend-flywheel"
version = "0.1.0"
description = "Automated Kindle niche research tool — identifies validated niches via Amazon BSR, Google Trends, and AI-powered review gap analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "google-generativeai>=0.8",
    "pytrends>=4.9",
    "plotly>=5.24",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/data/mock_amazon.py" = ["E501"]
"src/agents/gap_analyst.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
